[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:aggregator-regular]
command=/usr/local/bin/openapi-aggregator
environment=PORT="%(ENV_MCPO_REGULAR_AGGREGATOR_PORT)s",MCPO_SERVER_ROUTES_FILE="%(ENV_MCPO_SERVER_ROUTES_FILE)s"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:aggregator-core]
command=/usr/local/bin/openapi-aggregator
environment=PORT="%(ENV_MCPO_CORE_AGGREGATOR_PORT)s",MCPO_SERVERS="%(ENV_MCPO_CORE_SERVERS)s",MCPO_CONTAINER_PREFIX="mcpo-core",MCPO_USE_STATIC_SERVERS="true",MCPO_SERVER_ROUTES_FILE="%(ENV_MCPO_SERVER_ROUTES_FILE)s"
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c %(ENV_MCPO_NGINX_CONF)s
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30

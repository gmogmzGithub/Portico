[unix_http_server]
file=/tmp/supervisord-llm-gateway.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-llm-gateway.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord-llm-gateway.sock

[program:llm-gateway-bridge]
command=/usr/local/bin/bifrost-bridge
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bifrost]
command=/bin/sh -lc "until [ -s /app/data/config.json ]; do echo 'Waiting for /app/data/config.json...'; sleep 1; done; exec /app/docker-entrypoint.sh --host 127.0.0.1 --port 8080"
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

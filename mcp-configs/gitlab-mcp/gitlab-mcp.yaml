name: "GitLab MCP Server"
id: "gitlab-mcp"
display_name: "GitLab"
deployment_type: "docker"
experimental: false
user_installed: false
description: "Interact with Portico's GitLab instance"
guided_setup_description: "Create merge requests and manage GitLab issues"
use_cases:
  - "Search repositories"
  - "Create and view pull requests"
  - "Manage issues and merge requests"

required_env_vars:
  - name: GITLAB_PERSONAL_ACCESS_TOKEN
    placeholder: "your_gitlab_personal_access_token"
    description: "GitLab Personal Access Token"
    sensitive: true

preset_env_vars:
  - name: GITLAB_API_URL
    value: "https://example.invalid/api/v4"
  - name: GITLAB_IS_OLD
    value: "true"
    description: "Use Private-Token header instead of Authorization: Bearer for PAT auth (required for self-hosted GitLab)"
  - name: GITLAB_READ_ONLY_MODE
    value: "false"
  - name: USE_GITLAB_WIKI
    value: "false"
  - name: USE_MILESTONE
    value: "false"
  - name: USE_PIPELINE
    value: "false"


name: Datadog MCP Server
id: datadog
display_name: Datadog
deployment_type: docker
description:
  Datadog observability platform integration - query monitors, dashboards,
  metrics, incidents, and more via OAuth authentication
guided_setup_description: Query monitors, dashboards, metrics, and incidents
user_installed: false
is_core: false
required_env_vars: []

oauth:
  type: "dcr"
  provider: "datadog"
  requires_user_authorization: true

use_cases:
  - Query Datadog monitors and alerts
  - Search dashboards and metrics
  - Investigate incidents
  - Access observability data

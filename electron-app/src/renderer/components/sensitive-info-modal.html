<style>
  .sensitive-info-modal {
    position: fixed;
    inset: 0;
    background: rgba(30, 35, 36, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .sensitive-info-modal.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    cursor: default;
  }

  .platform-darwin .sensitive-info-modal.visible {
    -webkit-app-region: drag;
  }

  .sensitive-info-content {
    background: var(--bg-secondary, #2d3233);
    border-radius: 16px;
    padding: 22px;
    width: min(720px, 94vw);
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
    animation: sensitiveInfoSlideIn 0.3s ease-out;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
  }

  .platform-darwin .sensitive-info-content,
  .platform-darwin .sensitive-info-content * {
    -webkit-app-region: no-drag;
  }

  @keyframes sensitiveInfoSlideIn {
    from {
      transform: translateY(-20px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .sensitive-info-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-tertiary, #737373);
    transition: all 0.2s ease;
  }

  .sensitive-info-close-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary, #f3f4f6);
  }

  .sensitive-info-hide-btn {
    position: absolute;
    top: 14px;
    right: 50px;
    width: 28px;
    height: 28px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-tertiary, #737373);
    transition: all 0.2s ease;
  }

  .sensitive-info-hide-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary, #f3f4f6);
  }

  .sensitive-info-header {
    margin-bottom: 14px;
    padding-right: 34px;
  }

  .sensitive-info-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sensitive-info-title-logo-badge {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 999px;
    /* The shared model-logo badge is transparent everywhere else in the app —
       no tinted disc behind the logo. */
    background: transparent;
    color: var(--accent-primary-light, #d3e3ff);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .sensitive-info-title-logo-badge.has-logo-image {
    padding: 6px;
    box-sizing: border-box;
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.18);
  }

  .sensitive-info-title-logo-badge.dark-badge-light-mode {
    background: #000000;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
  }

  .sensitive-info-title-logo-badge.has-logo-image.celestial-logo {
    padding: 0;
    background: transparent;
    box-shadow: none;
  }

  .sensitive-info-title-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .sensitive-info-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary, #f3f4f6);
    margin: 0;
    line-height: 1.2;
  }

  .sensitive-info-panel {
    background: var(--bg-surface, #323738);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }

  .sensitive-info-preamble {
    margin: 0 0 14px;
    padding: 16px 18px;
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.18);
    color: var(--text-secondary, #d1d5db);
    font-size: 14px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }

  .sensitive-info-preamble[hidden] {
    display: none;
  }

  .sensitive-info-preamble > :first-child {
    margin-top: 0;
  }

  .sensitive-info-preamble > :last-child {
    margin-bottom: 0;
  }

  .sensitive-info-preamble p {
    margin: 0 0 10px;
  }

  .sensitive-info-preamble ol,
  .sensitive-info-preamble ul {
    margin: 8px 0 10px;
    padding-left: 24px;
  }

  .sensitive-info-preamble li + li {
    margin-top: 5px;
  }

  .sensitive-info-preamble li > p {
    margin: 0;
  }

  .sensitive-info-preamble code {
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(15, 23, 42, 0.34);
    color: var(--text-primary, #f3f4f6);
    font-size: 0.92em;
  }

  .sensitive-info-preamble a {
    color: var(--accent-primary-light, #d3e3ff);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  .sensitive-info-visual-aid {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    margin-left: 6px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-tertiary, #9ca3af);
    cursor: pointer;
    vertical-align: middle;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .sensitive-info-visual-aid:hover,
  .sensitive-info-visual-aid:focus-visible {
    background: rgba(var(--accent-primary-rgb, 79, 148, 255), 0.14);
    color: var(--accent-primary-light, #d3e3ff);
    outline: none;
  }

  /* --sensitive-info-aid-fit is set by the positioner to the space available
     to the RIGHT of the hovered magnifier, so the tooltip shrinks to fit that
     side instead of ever flipping to the left. */
  .sensitive-info-visual-aid-tooltip {
    position: fixed;
    z-index: 10;
    width: max-content;
    /* border-box so the max-width caps (and the aid-fit space constraint)
       bound the tooltip's FULL rendered box — otherwise padding/border push
       it past the window edge when space is tight. */
    box-sizing: border-box;
    max-width: min(266px, calc(100vw - 32px), var(--sensitive-info-aid-fit, 9999px));
    padding: 8px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 12px;
    background: var(--bg-elevated, #26292a);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }

  .sensitive-info-visual-aid-tooltip[hidden] {
    display: none;
  }

  .sensitive-info-visual-aid-tooltip img {
    display: block;
    max-width: 100%;
    max-height: 224px;
    margin: 0 auto;
    border-radius: 8px;
  }

  /* Large (2x retina) skill screenshots: ~35% of natural width is the ideal
     display size; these caps get there within viewport limits. Dimensions
     only — theme colors come from the base tooltip rules. */
  .sensitive-info-visual-aid-tooltip--large {
    max-width: min(49vw, 630px, var(--sensitive-info-aid-fit, 9999px));
  }

  .sensitive-info-visual-aid-tooltip--large img {
    max-height: min(49vh, 504px);
  }

  .sensitive-info-panel-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    align-items: center;
  }

  .sensitive-info-tag {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(var(--accent-primary-rgb, 79, 148, 255), 0.14);
    color: var(--accent-primary-light, #d3e3ff);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .sensitive-info-prompt {
    margin: 0;
    font-size: 18px;
    line-height: 1.3;
    color: var(--text-primary, #f3f4f6);
    overflow-wrap: anywhere;
  }

  .sensitive-info-disclosure {
    margin: 10px 0 0;
    font-size: 13px;
    line-height: 1.4;
    color: var(--text-secondary, #d1d5db);
    overflow-wrap: anywhere;
  }

  .sensitive-info-field {
    display: grid;
    gap: 6px;
  }

  .sensitive-info-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary, #d1d5db);
  }

  .sensitive-info-input {
    width: 100%;
    min-height: 44px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    padding: 12px 14px;
    background: rgba(15, 23, 42, 0.24);
    color: var(--text-primary, #f9fafb);
    font: inherit;
    line-height: 1.35;
    box-sizing: border-box;
    letter-spacing: 0;
  }

  .sensitive-info-input:focus {
    outline: none;
    border-color: rgba(var(--accent-primary-rgb, 79, 148, 255), 0.42);
    box-shadow: 0 0 0 1px rgba(var(--accent-primary-rgb, 79, 148, 255), 0.22);
  }

  .sensitive-info-footer {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .sensitive-info-actions-left,
  .sensitive-info-actions-right {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .sensitive-info-actions-right {
    margin-left: auto;
    justify-content: flex-end;
  }

  .sensitive-info-btn {
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }

  .sensitive-info-btn-primary {
    background: var(--accent-primary, #4f94ff);
    color: #ffffff;
  }

  .sensitive-info-btn-primary:hover:not(:disabled) {
    background: var(--accent-primary-hover, #6aa6ff);
  }

  .sensitive-info-btn-secondary {
    background: var(--btn-secondary-bg, rgba(255, 255, 255, 0.05));
    border-color: var(--btn-secondary-border, rgba(255, 255, 255, 0.1));
    color: var(--text-primary, #f3f4f6);
  }

  .sensitive-info-btn-secondary:hover:not(:disabled) {
    background: var(--btn-secondary-hover, rgba(255, 255, 255, 0.1));
  }

  .sensitive-info-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  [data-theme="light"] .sensitive-info-modal {
    background: rgba(245, 245, 245, 0.95);
  }

  [data-theme="light"] .sensitive-info-content {
    background: #ffffff;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  }

  [data-theme="light"] .sensitive-info-title-logo-badge {
    background: transparent;
    color: #003a9b;
  }

  [data-theme="light"] .sensitive-info-visual-aid:hover,
  [data-theme="light"] .sensitive-info-visual-aid:focus-visible {
    background: rgba(0, 58, 155, 0.1);
    color: #003a9b;
  }

  [data-theme="light"] .sensitive-info-visual-aid-tooltip {
    background: #ffffff;
    border-color: rgba(15, 23, 42, 0.12);
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
  }

  [data-theme="light"] .sensitive-info-title-logo-badge.has-logo-image {
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.08);
  }

  [data-theme="light"] .sensitive-info-title-logo-badge.dark-badge-light-mode {
    background: #000000;
    color: #ffffff;
  }

  [data-theme="light"] .sensitive-info-title-logo-badge.has-logo-image.celestial-logo {
    padding: 0;
    background: transparent;
    box-shadow: none;
  }

  [data-theme="light"] .sensitive-info-title,
  [data-theme="light"] .sensitive-info-prompt {
    color: #0f172a;
  }

  [data-theme="light"] .sensitive-info-label {
    color: #475569;
  }

  [data-theme="light"] .sensitive-info-disclosure {
    color: #475569;
  }

  [data-theme="light"] .sensitive-info-panel {
    background: #f8fafc;
  }

  [data-theme="light"] .sensitive-info-preamble {
    border-color: rgba(15, 23, 42, 0.1);
    background: rgba(248, 250, 252, 0.92);
    color: #475569;
  }

  [data-theme="light"] .sensitive-info-preamble code {
    background: rgba(15, 23, 42, 0.07);
    color: #0f172a;
  }

  [data-theme="light"] .sensitive-info-preamble a {
    color: #1d4ed8;
  }

  [data-theme="light"] .sensitive-info-tag {
    background: rgba(0, 58, 155, 0.12);
    color: #003a9b;
  }

  [data-theme="light"] .sensitive-info-input {
    background: #ffffff;
    border-color: rgba(15, 23, 42, 0.1);
    color: #0f172a;
  }

  [data-theme="light"] .sensitive-info-input:focus {
    border-color: rgba(var(--accent-primary-rgb, 0, 58, 155), 0.16);
    box-shadow: 0 0 0 1px rgba(var(--accent-primary-rgb, 0, 58, 155), 0.12);
  }

  [data-theme="light"] .sensitive-info-btn-primary {
    background: var(--accent-primary, #003a9b);
    color: #ffffff;
  }

  [data-theme="light"] .sensitive-info-btn-primary:hover:not(:disabled) {
    background: var(--accent-primary-hover, #002c75);
  }

  [data-theme="light"] .sensitive-info-btn-secondary {
    background: rgba(0, 0, 0, 0.04);
    border-color: rgba(0, 0, 0, 0.08);
    color: #525252;
  }

  [data-theme="light"] .sensitive-info-btn-secondary:hover:not(:disabled) {
    background: rgba(0, 0, 0, 0.08);
  }

  [data-theme="light"] .sensitive-info-close-btn {
    background: rgba(0, 0, 0, 0.04);
    border-color: rgba(0, 0, 0, 0.08);
    color: #737373;
  }

  [data-theme="light"] .sensitive-info-close-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    color: #111827;
  }

  [data-theme="light"] .sensitive-info-hide-btn {
    background: rgba(0, 0, 0, 0.04);
    border-color: rgba(0, 0, 0, 0.08);
    color: #737373;
  }

  [data-theme="light"] .sensitive-info-hide-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    color: #111827;
  }

  @media (max-width: 720px) {
    .sensitive-info-content {
      padding: 18px;
      width: min(100vw - 24px, 100%);
    }

    .sensitive-info-title-row,
    .sensitive-info-panel-top,
    .sensitive-info-footer {
      flex-direction: column;
      align-items: stretch;
    }

    .sensitive-info-actions-left,
    .sensitive-info-actions-right {
      width: 100%;
    }

    .sensitive-info-actions-right {
      margin-left: 0;
      justify-content: stretch;
    }

    .sensitive-info-btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<div id="sensitive-info-modal" class="sensitive-info-modal" aria-hidden="true">
  <div class="sensitive-info-content" role="dialog" aria-modal="true" aria-labelledby="sensitive-info-title" aria-describedby="sensitive-info-preamble sensitive-info-prompt sensitive-info-disclosure">
    <button
      id="sensitive-info-hide-btn"
      class="sensitive-info-hide-btn"
      type="button"
      title="Hide secure request and return to chat"
      aria-label="Hide secure request and return to chat"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <button id="sensitive-info-close-btn" class="sensitive-info-close-btn" type="button" aria-label="Close" title="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="sensitive-info-header">
      <div class="sensitive-info-title-row">
        <span class="sensitive-info-title-logo-badge" id="sensitive-info-title-logo-badge" aria-hidden="true">
          <img class="sensitive-info-title-logo" id="sensitive-info-title-logo" alt="" hidden>
          <span id="sensitive-info-title-logo-fallback">AI</span>
        </span>
        <h2 id="sensitive-info-title" class="sensitive-info-title">Sensitive information requested</h2>
      </div>
    </div>

    <div id="sensitive-info-preamble" class="sensitive-info-preamble" hidden></div>

    <div class="sensitive-info-panel">
      <div class="sensitive-info-panel-top">
        <span class="sensitive-info-tag" id="sensitive-info-header-tag">Sensitive info</span>
      </div>
      <h3 id="sensitive-info-prompt" class="sensitive-info-prompt"></h3>
      <p id="sensitive-info-disclosure" class="sensitive-info-disclosure"></p>
    </div>

    <div class="sensitive-info-field">
      <label id="sensitive-info-label" class="sensitive-info-label" for="sensitive-info-input">Sensitive value</label>
      <input id="sensitive-info-input" class="sensitive-info-input" type="password" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sensitive-info-footer">
      <div class="sensitive-info-actions-left">
        <button id="sensitive-info-cancel-btn" class="sensitive-info-btn sensitive-info-btn-secondary" type="button">Cancel</button>
      </div>
      <div class="sensitive-info-actions-right">
        <button id="sensitive-info-submit-btn" class="sensitive-info-btn sensitive-info-btn-primary" type="button" disabled>Submit</button>
      </div>
    </div>
  </div>
</div>

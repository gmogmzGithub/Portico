<style>

    background: var(--accent-primary, #4f94ff);
    color: #ffffff;

  [data-theme="light"] .chat-workspace-consent-btn-primary:hover:not(:disabled) {

  [data-theme="light"] .chat-workspace-consent-btn-secondary {
    background: rgba(0, 0, 0, 0.04);

    color: #525252;

    background: rgba(0, 0, 0, 0.08);
  }

  [data-theme="light"] .chat-workspace-consent-close-btn {
    background: rgba(0, 0, 0, 0.04);
    border-color: rgba(0, 0, 0, 0.08);
    color: #737373;
  }

  [data-theme="light"] .chat-workspace-consent-close-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    color: #111827;
  }

  [data-theme="light"] .chat-workspace-consent-hide-btn {
    background: rgba(0, 0, 0, 0.04);
    border-color: rgba(0, 0, 0, 0.08);
    color: #737373;
  }

  [data-theme="light"] .chat-workspace-consent-hide-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    color: #111827;
  }

  @media (max-width: 720px) {

      width: min(100vw - 24px, 100%);

    .chat-workspace-consent-panel-top,
    .chat-workspace-consent-footer,
    .chat-workspace-consent-path-row {
      grid-template-columns: 1fr;
      flex-direction: column;
      align-items: stretch;

    .chat-workspace-consent-actions-right {
      margin-left: 0;
      justify-content: stretch;
    }

    .chat-workspace-consent-btn {

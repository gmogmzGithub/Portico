<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Portico main to beta codebase evolution</title>
  <desc id="desc">Comparison of code line counts between origin/main and origin/beta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#101820"/>
      <stop offset="1" stop-color="#17251b"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0" stop-color="#00a3ff"/>
      <stop offset="0.5" stop-color="#32d583"/>
      <stop offset="1" stop-color="#ffbf3f"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" x2="1">
      <stop offset="0" stop-color="#00a3ff"/>
      <stop offset="0.64" stop-color="#32d583"/>
      <stop offset="1" stop-color="#ffbf3f"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .panel { fill: rgba(255,255,255,0.055); stroke: rgba(255,255,255,0.12); }
      .ink { fill: #f7fbff; }
      .muted { fill: #a7b4c5; }
      .soft { fill: #d9e2ec; }
      .accent { fill: #32d583; }
      .tiny { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .label { font: 650 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .h1 { font: 760 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .h2 { font: 720 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .mega { font: 800 58px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .metric { font: 760 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .bar-bg { fill: rgba(255,255,255,0.1); }
      .rule { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="850"/>
  <path d="M0 0H1200V112C1021 128 921 79 746 96C568 113 486 175 308 160C178 149 91 111 0 127Z" fill="url(#hero)" opacity="0.2"/>
  <path d="M0 742C146 710 260 748 402 721C559 693 639 624 803 649C956 672 1043 757 1200 715V850H0Z" fill="#32d583" opacity="0.08"/>

  <text x="80" y="76" class="h1 ink">Portico: Main -> Beta Evolution</text>
  <text x="82" y="112" class="body muted">Same counting rules on fetched refs: tracked text code/config, excluding binaries, Markdown, and lock files.</text>

  <g filter="url(#softShadow)">
    <rect x="80" y="140" width="310" height="176" rx="18" class="panel"/>
    <text x="112" y="184" class="tiny muted">BASELINE</text>
    <text x="112" y="235" class="mega ink">48.3k</text>
    <text x="116" y="267" class="h2 soft">lines on main</text>
    <line x1="112" y1="286" x2="358" y2="286" class="rule"/>
    <text x="116" y="306" class="tiny muted">114 files, origin/main 4abfdda</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="445" y="140" width="310" height="176" rx="18" class="panel"/>
    <text x="477" y="184" class="tiny muted">BETA</text>
    <text x="477" y="235" class="mega ink">475.5k</text>
    <text x="481" y="267" class="h2 soft">lines on beta</text>
    <line x1="477" y1="286" x2="723" y2="286" class="rule"/>
    <text x="481" y="306" class="tiny muted">1,055 files, origin/beta 5941b13</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="810" y="140" width="310" height="176" rx="18" class="panel"/>
    <text x="842" y="184" class="tiny muted">EVOLUTION</text>
    <text x="842" y="235" class="metric ink">+427.3k</text>
    <text x="846" y="267" class="h2 soft">net new lines</text>
    <line x1="842" y1="286" x2="1088" y2="286" class="rule"/>
    <text x="846" y="306" class="tiny muted">9.9x larger, +941 tracked source files</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="80" y="344" width="1040" height="96" rx="18" class="panel"/>
    <text x="112" y="386" class="h2 ink">Branch Growth</text>
    <text x="112" y="416" class="tiny muted">main: 48.3k lines</text>
    <rect x="310" y="405" width="97" height="14" rx="7" fill="#00a3ff"/>
    <text x="445" y="416" class="tiny muted">beta: 475.5k lines</text>
    <rect x="592" y="405" width="430" height="14" rx="7" fill="url(#growth)"/>
    <text x="1038" y="416" class="label accent">+885%</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="80" y="468" width="1040" height="310" rx="18" class="panel"/>
    <text x="112" y="512" class="h2 ink">Language Expansion</text>
    <text x="112" y="538" class="tiny muted">Beta lines with net change from main. Smaller language buckets are grouped into Other.</text>

    <g transform="translate(112 582)">
      <text y="5" class="body soft">JavaScript</text><rect x="135" y="-8" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="-8" width="560" height="12" rx="6" fill="#f7df1e"/><text x="720" y="5" class="label muted">140.9k</text><text x="830" y="5" class="label accent">+131.8k</text>
      <text y="40" class="body soft">Python</text><rect x="135" y="27" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="27" width="460" height="12" rx="6" fill="#3776ab"/><text x="720" y="40" class="label muted">115.7k</text><text x="830" y="40" class="label accent">+97.8k</text>
      <text y="75" class="body soft">Rust</text><rect x="135" y="62" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="62" width="384.6" height="12" rx="6" fill="#f46623"/><text x="720" y="75" class="label muted">96.8k</text><text x="830" y="75" class="label accent">new</text>
      <text y="110" class="body soft">Shell</text><rect x="135" y="97" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="97" width="144.2" height="12" rx="6" fill="#89e051"/><text x="720" y="110" class="label muted">36.3k</text><text x="830" y="110" class="label accent">+29.3k</text>
      <text y="145" class="body soft">Svelte</text><rect x="135" y="132" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="132" width="116.1" height="12" rx="6" fill="#ff3e00"/><text x="720" y="145" class="label muted">29.2k</text><text x="830" y="145" class="label accent">+27.9k</text>
      <text y="180" class="body soft">CSS</text><rect x="135" y="167" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="167" width="87.9" height="12" rx="6" fill="#563d7c"/><text x="720" y="180" class="label muted">22.1k</text><text x="830" y="180" class="label accent">+19.7k</text>
      <text y="215" class="body soft">Other</text><rect x="135" y="202" width="560" height="12" rx="6" class="bar-bg"/><rect x="135" y="202" width="137.4" height="12" rx="6" fill="#8fa3b8"/><text x="720" y="215" class="label muted">34.6k</text><text x="830" y="215" class="label accent">+24.1k</text>
    </g>
  </g>
</svg>

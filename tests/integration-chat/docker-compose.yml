# Isolated compose project for the Tier-2 headless real-chat repro suite.
#
# ALWAYS invoke with an explicit project name so nothing here can collide with
# the developer stack (project portico / network portico-network):
#
#   docker compose -p portico-integration -f tests/integration-chat/docker-compose.yml up -d
#
# Images are the pre-pinned repro baselines by default; a post-fix green run
# sets portico_INT_IMAGE_TAG to freshly built tags. The OWUI image does NOT bake
# backend patches — they are applied at boot by the patch entrypoint from
# .runtime/patches (a git-HEAD snapshot generated by run.mjs so the
# concurrently edited working tree is never mounted).
#
# Host ports are offset into the 28xxx/29xxx/24xxx range: 28080 (open-webui),
# 29700 (mock-bedrock control), 24000 (llm-gateway, debugging convenience).
# No container_name / restart policies: names stay project-scoped and crashed
# services stay down for forensics.

services:
  mock-bedrock:
    image: node:20-alpine
    command: ["node", "/srv/server.mjs"]
    environment:
      - MOCK_PORT=9700
    volumes:
      - ./mock-bedrock/server.mjs:/srv/server.mjs:ro
    ports:
      - "127.0.0.1:29700:9700"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  llm-gateway:
    image: portico-bifrost-bridge:${portico_INT_IMAGE_TAG:-repro-baseline}
    ports:
      - "127.0.0.1:24000:4000"
    volumes:
      - ./.runtime/model_catalog.yaml:/app/model_catalog.yaml:ro
    environment:
      - TZ=UTC
      - NO_PROXY=localhost,127.0.0.1,::1,open-webui,llm-gateway,redis,mock-bedrock
      - no_proxy=localhost,127.0.0.1,::1,open-webui,llm-gateway,redis,mock-bedrock
      - PORTICO_LLM_API_KEY_FILE=/run/secrets/portico_llm_api_key
      - PORTICO_USER_ID=portico-integration
      - PORTICO_REDACT_ALLOW=false
      - PORTICO_BUILD_TRACK=integration-test
      - PROMPT_CACHE_ATLAS_ENABLED=true
      - BIFROST_BASE_URL=http://127.0.0.1:8080
      - BIFROST_CONFIG_OUTPUT=/app/data/config.json
      - BIFROST_BRIDGE_LOCAL_API_KEY_FILE=/run/secrets/bifrost_bridge_local_api_key
      - ULTRA_MULTI_AGENT_SIGNING_SECRET_FILE=/run/secrets/ultra_multi_agent_signing_secret
      - MODEL_CATALOG_PATH=/app/model_catalog.yaml
      # The whole point: Bedrock Converse traffic lands on the scripted mock.
      - LLM_PROXY_BASE_URL=http://mock-bedrock:9700
      - GPT_OPENAI_ROUTE_MODE=direct
      - BIFROST_BRIDGE_STREAM_IDLE_TIMEOUT_SECONDS=90
      - BIFROST_BRIDGE_STREAM_TOTAL_TIMEOUT_SECONDS=0
    secrets:
      - portico_llm_api_key
      - bifrost_bridge_local_api_key
      - ultra_multi_agent_signing_secret
    depends_on:
      - mock-bedrock

  open-webui:
    image: portico-open-webui:${portico_INT_IMAGE_TAG:-repro-baseline}
    entrypoint: ["/bin/bash", "/patch-entrypoint.sh"]
    ports:
      - "127.0.0.1:28080:8080"
    volumes:
      - owui-data:/app/backend/data
      - ./.runtime/patches/src/patches/patch-openwebui-entrypoint.sh:/patch-entrypoint.sh:ro
      - ./.runtime/patches/src/patches/backend:/app/patches/backend:ro
    environment:
      - TZ=UTC
      - NO_PROXY=localhost,127.0.0.1,::1,open-webui,llm-gateway,redis,mock-bedrock
      - no_proxy=localhost,127.0.0.1,::1,open-webui,llm-gateway,redis,mock-bedrock
      - HF_HUB_OFFLINE=1
      - WEBUI_AUTH=True
      # Headless driver auth: first signup becomes admin.
      - ENABLE_SIGNUP=True
      - ENABLE_LOGIN_FORM=True
      - ENABLE_PASSWORD_AUTH=True
      - ENABLE_VERSION_UPDATE_CHECK=False
      - WEBUI_SECRET_KEY_FILE=/run/secrets/webui_secret_key
      - OWUI_AUTH_BRIDGE_SECRET_FILE=/run/secrets/owui_auth_bridge_secret
      - ULTRA_MULTI_AGENT_SIGNING_SECRET_FILE=/run/secrets/ultra_multi_agent_signing_secret
      - GLOBAL_LOG_LEVEL=INFO
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URL=http://llm-gateway:4000/v1
      - OPENAI_API_KEY_FILE=/run/secrets/bifrost_bridge_local_api_key
      - LLM_GATEWAY_MULTIMODAL_INPUT=false
      # Pending-steer state lives in redis — required for defect B.
      - REDIS_URL=redis://redis:6379
      - WEBSOCKET_REDIS_LOCK_TIMEOUT=300
      - CHAT_RESPONSE_MAX_TOOL_CALL_RETRIES=8
      - ENABLE_REALTIME_CHAT_SAVE=True
      - ENABLE_EVALUATION_ARENA_MODELS=False
      - BYPASS_EMBEDDING_AND_RETRIEVAL=True
      - VECTOR_DB=disabled
      - STORAGE_PROVIDER=local
      - ENABLE_CODE_EXECUTION=False
      - ENABLE_CODE_INTERPRETER=False
      - USER_PERMISSIONS_FEATURES_CODE_INTERPRETER=False
      - USER_PERMISSIONS_CHAT_STT=False
      # Keep every auxiliary task-model completion out of the scripted mock:
      # scenario request logs must contain chat rounds only.
      - ENABLE_TITLE_GENERATION=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_FOLLOW_UP_GENERATION=False
      - OWUI_RATE_LIMIT_TEST_RATE=0
      - GPT_OPENAI_ROUTE_MODE=direct
      - AIOHTTP_CLIENT_TIMEOUT=
    secrets:
      - bifrost_bridge_local_api_key
      - ultra_multi_agent_signing_secret
      - owui_auth_bridge_secret
      - webui_secret_key
    depends_on:
      - llm-gateway
      - redis
      - mock-bedrock

volumes:
  owui-data:

secrets:
  portico_llm_api_key:
    file: ./.runtime/secrets/portico_llm_api_key
  bifrost_bridge_local_api_key:
    file: ./.runtime/secrets/bifrost_bridge_local_api_key
  ultra_multi_agent_signing_secret:
    file: ./.runtime/secrets/ultra_multi_agent_signing_secret
  owui_auth_bridge_secret:
    file: ./.runtime/secrets/owui_auth_bridge_secret
  webui_secret_key:
    file: ./.runtime/secrets/webui_secret_key

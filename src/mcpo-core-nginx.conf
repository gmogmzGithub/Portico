server {
    listen 8081;

    # OpenAPI aggregation endpoint
    location /openapi.json {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Aggregator server discovery + readiness endpoints
    location /servers {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /internal/cache/invalidate {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # OAuth coordination endpoints
    location /oauth/status {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /oauth/current {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /oauth/pending {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /oauth/refresh/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /oauth/reload/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /oauth/callback {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Per-core-server routing
        location /agent-vm/ {
            set $upstream mcpo-group-core:8100;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3660s;
        }
        location /artifacts/ {
            set $upstream mcpo-group-core:8101;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /mcp-assistant/ {
            set $upstream mcpo-group-core:8102;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /scheduling/ {
            set $upstream mcpo-group-core:8103;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /skills/ {
            set $upstream mcpo-group-core:8104;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3660s;
        }
        location /subagents/ {
            set $upstream mcpo-group-core:8105;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 7800s;
        }
        location /web-tools/ {
            set $upstream mcpo-group-core:8106;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

    location / {
        return 404 'Core server not found';
        add_header Content-Type text/plain;
    }
}

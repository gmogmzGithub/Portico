[workspace]
members = ["crates/mcp-orc", "crates/openapi-aggregator", "crates/health-check"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
futures = "0.3"
hmac = "0.12"
http = "1.3"
libc = "0.2"
log = "0.4"
md5 = "0.8"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
rmcp = { version = "1.1.0", default-features = false, features = ["auth", "client", "macros", "reqwest", "schemars", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
redis = "0.32"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
sse-stream = "0.2.1"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
url = "2.5"
walkdir = "2.5"

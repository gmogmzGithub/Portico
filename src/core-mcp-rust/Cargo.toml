[workspace]
members = [
    "crates/core-mcp-shared",
    "crates/agent-vm-server",
    "crates/artifacts-server",
    "crates/mcp-assistant-server",
    "crates/scheduling-server",
    "crates/skills-server",
    "crates/subagents-server",
    "crates/web-tools-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
bollard = "0.20.1"
chrono = "0.4"
chrono-tz = "0.10"
flate2 = "1.1"
futures-util = "0.3"
glob = "0.3"
md5 = "0.8"
mime_guess = "2.0"
percent-encoding = "2.3"
redis = "1.0.4"
regex = "1.11"
rmcp = { version = "1.1.0", default-features = false, features = ["base64", "client", "macros", "server", "transport-child-process", "transport-io"] }
rustix = { version = "1.1", features = ["fs"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tar = "0.4"
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.12", features = ["v4"] }
walkdir = "2.5"
yaml-rust2 = "0.11"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

worker_rlimit_nofile 65535;

worker_processes auto;

events {
    worker_connections 16384;
}

http {
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;

        # OpenAPI aggregation endpoint
        location /openapi.json {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Aggregator server discovery + readiness endpoints
        location /servers {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /internal/cache/invalidate {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        # OAuth coordination endpoints
        location /oauth/status {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /oauth/current {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /oauth/pending {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /oauth/refresh/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /oauth/reload/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /oauth/callback {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Per-server routing
        location /data-plat-mcp/ {
            set $upstream mcpo-data-plat-mcp:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 660s;
        }
        location /datadog/ {
            set $upstream mcpo-datadog:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /glean/ {
            set $upstream mcpo-glean:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /google_workspace/ {
            set $upstream mcpo-google-workspace:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /mcp-atlassian/ {
            set $upstream mcpo-mcp-atlassian:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /product-pal/ {
            set $upstream mcpo-product-pal:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /slack/ {
            set $upstream mcpo-slack:8000;
            proxy_pass http://$upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Default: return 404 for unknown paths
        location / {
            return 404 'Server not found';
            add_header Content-Type text/plain;
        }
    }

    # OAuth callback server on port 3834 (HTTP)
    server {
        listen 3834;

        location /callback {
            proxy_pass http://127.0.0.1:8080/oauth/callback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404 'OAuth callback only';
            add_header Content-Type text/plain;
        }
    }

    include /etc/nginx/conf.d/mcpo-core.conf;
}

  # GPT-5.x models use Responses API for reasoning block support
  - model_name: "GPT-5.6 Sol"
    picker:
      provider: openai
      tier: heavy
    litellm_params:
      model: openai/responses/gpt-5.6-sol
      <<: *gpt5-responses-params
      prompt_cache_retention: "24h"
    model_info:
      base_model: gpt-5.6-sol
      max_tokens: 1050000
      max_output_tokens: 128000
      supports_reasoning: True
      supports_function_calling: True
      reasoning_effort_options: ["none", "low", "medium", "high", "xhigh", "max", "ultra"]

  - model_name: "GPT-5.6 Sol Pro"
    picker:
      provider: openai
      tier: premium
    litellm_params:
      # Sol Pro is an PORTICO alias. The bridge routes it to gpt-5.6-sol and
      # injects reasoning.mode="pro"; there is no provider-side -pro slug.
      model: openai/responses/gpt-5.6-sol-pro
      <<: *gpt5-responses-params
      prompt_cache_retention: "24h"
    model_info:
      base_model: gpt-5.6-sol-pro
      max_tokens: 1050000
      max_output_tokens: 128000
      supports_reasoning: True
      supports_function_calling: True
      disabled: True
      disabled_reason: "Temporarily disabled due to high costs"
      reasoning_effort_options: ["none", "low", "medium", "high", "xhigh", "max"]

  - model_name: "GPT-5.6 Terra"

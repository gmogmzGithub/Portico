---
# Define common headers once using YAML anchor
x-portico-headers: &provider-headers
  x-portico-userid: "os.environ/PORTICO_USER_ID"
  x-portico-redact-allow: "os.environ/PORTICO_REDACT_ALLOW"
  x-portico-appid: "portico"
  x-portico-track: "os.environ/PORTICO_BUILD_TRACK"
  x-portico-log-request: "false"
  x-portico-log-response: "false"
  Content-Type: "application/json"

# GPT-5.x Responses API configuration for reasoning support.
# api_base includes /v1 because the bridge appends /responses for Responses API calls.
# Reasoning request bodies are set dynamically by the Rust bridge based on model
# family and UI selection. GPT-5.x variants also opt into reasoning summaries
# with summary:"auto" so OWUI can render streamed reasoning blocks.
x-gpt5-responses-params: &gpt5-responses-params
  api_base: https://api.openai.com/v1
  api_key: "os.environ/PORTICO_LLM_API_KEY"
  extra_headers: *provider-headers
  merge_reasoning_content_in_choices: true
  # These pass-through params are consumed by the Rust bridge for OpenAI prompt
  # cache behavior.
  allowed_openai_params: ["prompt_cache_retention", "prompt_cache_key"]

model_migrations:
  "Atlas Opus 4.6": "Atlas Opus 5"
  "Atlas Opus 4.7": "Atlas Opus 5"
  "GPT-5.4": "GPT-5.6 Sol"
  "GPT-5.4 pro": "GPT-5.6 Sol Pro"
  "GPT-4.1": "GPT-5.6 Sol"
  "GPT-4.1 mini": "GPT-5.6 Terra"
  "GPT-4.1 nano": "GPT-5.6 Luna"

model_list:
  - model_name: "Atlas Sonnet 5"
    picker:
      provider: anthropic
      tier: general
    litellm_params:
      # Bridge-side tool-spec slimming (Plan A) — on by default.
      tool_slimming: true
      model: bedrock/converse_like/us.anthropic.atlas-sonnet-5
      api_base: https://api.anthropic.com/v1
      api_key: "os.environ/PORTICO_LLM_API_KEY"
      extra_headers: *provider-headers
      # Sonnet 5 is adaptive-thinking-only: the Rust bridge injects
      # thinking/output_config dynamically; budget_tokens is rejected by the
      # model, so no reasoning_config block here.
      allowed_openai_params: ["tools", "tool_choice", "parallel_tool_calls"]
    model_info:
      base_model: us.anthropic.atlas-sonnet-5
      max_tokens: 1000000 # 1M context is the native default on Sonnet 5
      max_output_tokens: 128000
      supports_reasoning: True
      supports_function_calling: True
      reasoning_effort_options: ["low", "medium", "high", "xhigh", "max"]

  - model_name: "Atlas Sonnet 4.6"
    picker:
      provider: anthropic
      tier: general
    litellm_params:
      # Bridge-side tool-spec slimming (Plan A) — on by default.
      tool_slimming: true
      model: bedrock/converse_like/us.anthropic.atlas-sonnet-4-6
      api_base: https://api.anthropic.com/v1
      api_key: "os.environ/PORTICO_LLM_API_KEY"
      extra_headers: *provider-headers
      # reasoning_config: budget_tokens is dynamically set by the Rust bridge based on UI selection
      reasoning_config:
        type: "enabled"
        budget_tokens: 10000
      allowed_openai_params: ["tools", "tool_choice", "parallel_tool_calls"]
    model_info:
      base_model: us.anthropic.atlas-sonnet-4-6
      max_tokens: 1000000 # 1M context via context-1m-2025-08-07 beta header
      max_output_tokens: 64000
      supports_reasoning: True
      supports_function_calling: True
      reasoning_effort_options: ["low", "medium", "high", "max"]

  - model_name: "Atlas Opus 5"
    picker:
      provider: anthropic
      tier: heavy
    litellm_params:
      # Bridge-side tool-spec slimming (Plan A) — on by default.
      tool_slimming: true
      model: bedrock/converse_like/us.anthropic.atlas-opus-5
      api_base: https://api.anthropic.com/v1
      api_key: "os.environ/PORTICO_LLM_API_KEY"
      extra_headers: *provider-headers
      # Opus 5 is adaptive-thinking-only: the Rust bridge injects
      # thinking/output_config dynamically; budget_tokens is rejected by the
      # model, so no reasoning_config block here.
      atlas_prompt_cache_ttl: "1h"
      allowed_openai_params: ["tools", "tool_choice", "parallel_tool_calls"]
    model_info:
